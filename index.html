<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fa"><meta name="description" content="오프라인 개인 가계부"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"><title>나의 가계부</title></head><body><div id="app"><header><div><small>PERSONAL LEDGER</small><h1>나의 가계부</h1></div><button class="iconbtn" id="newBtn" aria-label="거래 추가">＋</button></header><main id="view"></main><nav id="nav"><button data-tab="home" class="active">⌂<span>홈</span></button><button data-tab="history">☷<span>내역</span></button><button data-tab="stats">▥<span>통계</span></button><button data-tab="settings">⚙<span>설정</span></button></nav></div><dialog id="editor"><form id="transactionForm" method="dialog"><div class="modal-head"><h2 id="formTitle">거래 추가</h2><button type="button" class="plain" id="closeEditor">✕</button></div><div class="switch"><button type="button" id="expenseType" class="selected">지출</button><button type="button" id="incomeType">수입</button></div><label>금액 (원)<input id="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="0"></label><label>카테고리<select id="category" required></select></label><label>날짜<input id="date" type="date" required></label><label>메모 (선택)<input id="memo" maxlength="120" placeholder="어디에 사용했나요?"></label><div class="actions"><button type="button" class="secondary" id="deleteBtn" hidden>삭제</button><button type="submit" class="primary">저장하기</button></div></form></dialog><script src="db.js"></script><script src="app.js"></script></body></html>
